<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central Control — Gallery</title>
<style>
  :root { --bg:#14151a; --fg:#e8e8ee; --dim:#8a8d9a; --line:#2a2c36; --accent:#7aa2f7; }
  * { box-sizing:border-box; }
  body { margin:0; padding:32px 16px; background:var(--bg); color:var(--fg);
         font:15px/1.6 ui-sans-serif,system-ui,"Segoe UI",sans-serif; }
  main { max-width:920px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.sub { color:var(--dim); margin:0 0 20px; font-size:13px; }
  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:22px; }
  .pill { font-size:12px; color:var(--dim); border:1px solid var(--line);
          border-radius:999px; padding:4px 11px; }
  .row { display:flex; gap:14px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .row img { width:120px; height:68px; object-fit:cover; border-radius:5px; background:#000; flex:none; }
  .meta { min-width:0; flex:1; }
  .idx { color:var(--dim); font-size:12px; }
  code { display:block; font:12px/1.5 ui-monospace,Consolas,monospace; color:var(--accent);
         word-break:break-all; margin-top:2px; }
  button { font:inherit; font-size:13px; padding:6px 12px; border-radius:6px; cursor:pointer;
           border:1px solid var(--line); background:#1e2029; color:var(--fg); flex:none; }
  button:hover { border-color:var(--accent); }
  .empty { color:var(--dim); padding:40px 0; text-align:center; }
</style>
</head>
<body>
<main>
  <h1>Central Control — Gallery</h1>
  <p class="sub">URL สำหรับวางในช่อง VRCUrl ของ Udon script</p>
  <div class="bar" id="bar"></div>
  <div id="list"><p class="empty">กำลังโหลด…</p></div>
</main>
<script>
const base = location.href.replace(/index\.html$/, '').replace(/\/?$/, '/');
const list = document.getElementById('list');
const bar  = document.getElementById('bar');

fetch(base + 'config.json', { cache: 'no-store' })
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(cfg => {
    const n = cfg.count | 0;

    bar.innerHTML =
      '<span class="pill">' + n + ' รูป</span>' +
      '<span class="pill">' + cfg.duration + ' วิ/รูป</span>' +
      '<span class="pill">loop: ' + (cfg.loop ? 'เปิด' : 'ปิด') + '</span>';

    const cfgBtn = document.createElement('button');
    cfgBtn.textContent = 'คัดลอก URL ของ config.json';
    cfgBtn.onclick = () => copy(base + 'config.json', cfgBtn, cfgBtn.textContent);
    bar.appendChild(cfgBtn);

    if (!n) { list.innerHTML = '<p class="empty">ยังไม่มีรูป — รัน build-gallery.ps1 ก่อน</p>'; return; }

    const urls = [];
    list.innerHTML = '';
    for (let i = 0; i < n; i++) {
      const url = base + 'images/' + i + '.jpg';
      urls.push(url);

      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML =
        '<img src="' + url + '" alt="' + i + '" loading="lazy">' +
        '<div class="meta"><span class="idx">ช่องที่ ' + i + '</span><code>' + url + '</code></div>';

      const btn = document.createElement('button');
      btn.textContent = 'คัดลอก';
      btn.onclick = () => copy(url, btn, 'คัดลอก');
      row.appendChild(btn);
      list.appendChild(row);
    }

    const all = document.createElement('button');
    all.textContent = 'คัดลอก URL รูปทั้งหมด';
    all.onclick = () => copy(urls.join('\n'), all, 'คัดลอก URL รูปทั้งหมด');
    bar.appendChild(all);
  })
  .catch(() => {
    list.innerHTML = '<p class="empty">อ่าน config.json ไม่ได้ — รัน build-gallery.ps1 แล้ว push ก่อน</p>';
  });

function copy(text, btn, label) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'คัดลอกแล้ว';
    setTimeout(() => { btn.textContent = label; }, 1200);
  });
}
</script>
</body>
</html>
