<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central Control — Galleries</title>
<style>
  :root { --bg:#14151a; --fg:#e8e8ee; --dim:#8a8d9a; --line:#2a2c36; --accent:#7aa2f7; --warn:#e0af68; }
  * { box-sizing:border-box; }
  body { margin:0; padding:32px 16px; background:var(--bg); color:var(--fg);
         font:15px/1.6 ui-sans-serif,system-ui,"Segoe UI",sans-serif; }
  main { max-width:960px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.sub { color:var(--dim); margin:0 0 28px; font-size:13px; }

  section { border:1px solid var(--line); border-radius:10px; padding:18px; margin-bottom:22px; }
  h2 { font-size:16px; margin:0 0 10px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  .pill { font-size:12px; color:var(--dim); border:1px solid var(--line);
          border-radius:999px; padding:3px 10px; }
  .pill.empty { color:var(--warn); border-color:var(--warn); }

  .row { display:flex; gap:14px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .row img { width:104px; height:60px; object-fit:cover; border-radius:5px; background:#000; flex:none; }
  .meta { min-width:0; flex:1; }
  .idx { color:var(--dim); font-size:12px; }
  code { display:block; font:12px/1.5 ui-monospace,Consolas,monospace; color:var(--accent);
         word-break:break-all; margin-top:2px; }
  button { font:inherit; font-size:13px; padding:5px 11px; border-radius:6px; cursor:pointer;
           border:1px solid var(--line); background:#1e2029; color:var(--fg); flex:none; }
  button:hover { border-color:var(--accent); }
  .note { color:var(--dim); font-size:13px; padding:10px 0; }
</style>
</head>
<body>
<main>
  <h1>Central Control — Galleries</h1>
  <p class="sub">แต่ละแกลเลอรีเป็นสไลด์โชว์อิสระ มี config.json ของตัวเอง — ใช้ Udon script คนละตัว</p>
  <div id="root"><p class="note">กำลังโหลด…</p></div>
</main>
<script>
const base = location.href.replace(/index\.html$/, '').replace(/\/?$/, '/');
const root = document.getElementById('root');

function copy(text, btn, label) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'คัดลอกแล้ว';
    setTimeout(() => { btn.textContent = label; }, 1200);
  });
}

function mkButton(label, text) {
  const b = document.createElement('button');
  b.textContent = label;
  b.onclick = () => copy(text, b, label);
  return b;
}

function head(url) {
  return fetch(url, { method: 'HEAD', cache: 'no-store' }).then(r => r.ok).catch(() => false);
}

// config.json ไม่ได้บอกนามสกุลหรือเลขเริ่มต้น เลยยิง HEAD ถามเอาเอง
function detectNaming(dir) {
  return Promise.all([head(dir + 'images/0.png'), head(dir + 'images/1.png'),
                      head(dir + 'images/0.jpg'), head(dir + 'images/1.jpg')])
    .then(hit => {
      if (hit[0]) return { ext: 'png', first: 0 };
      if (hit[1]) return { ext: 'png', first: 1 };
      if (hit[2]) return { ext: 'jpg', first: 0 };
      return { ext: 'jpg', first: 1 };
    });
}

function renderGallery(g) {
  const dir = base + g.path.replace(/\/?$/, '/');
  const sec = document.createElement('section');
  sec.innerHTML = '<h2>' + g.name + '</h2><p class="note">กำลังอ่าน config…</p>';
  root.appendChild(sec);

  return Promise.all([
    fetch(dir + 'config.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : Promise.reject(r.status)),
    detectNaming(dir)
  ])
  .then(pair => {
    const cfg = pair[0], ext = pair[1].ext, first = pair[1].first;
    const n = cfg.count | 0;

    sec.innerHTML = '';
    const h = document.createElement('h2');
    h.textContent = g.name;
    sec.appendChild(h);

    const bar = document.createElement('div');
    bar.className = 'bar';
    bar.innerHTML =
      '<span class="pill' + (n ? '' : ' empty') + '">' + (n ? n + ' รูป' : 'ยังไม่มีรูป') + '</span>' +
      '<span class="pill">' + cfg.duration + ' วิ/รูป</span>' +
      '<span class="pill">loop: ' + (cfg.loop ? 'เปิด' : 'ปิด') + '</span>';
    bar.appendChild(mkButton('คัดลอก Config Url', dir + 'config.json'));
    sec.appendChild(bar);

    if (!n) {
      const note = document.createElement('p');
      note.className = 'note';
      note.textContent = 'วางรูปใน ' + g.path + '/images/ แล้วตั้ง count ใน config.json ให้ตรงจำนวน';
      sec.appendChild(note);
      return;
    }

    const urls = [];
    for (let i = 0; i < n; i++) {
      const name = (i + first) + '.' + ext;
      const url  = dir + 'images/' + name;
      urls.push(url);

      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML =
        '<img src="' + url + '" alt="' + name + '" loading="lazy">' +
        '<div class="meta"><span class="idx">Element ' + i + '  →  ' + name +
        '</span><code>' + url + '</code></div>';
      row.appendChild(mkButton('คัดลอก', url));
      sec.appendChild(row);
    }

    bar.appendChild(mkButton('คัดลอก URL รูปทั้งหมด', urls.join('\n')));
  })
  .catch(() => {
    sec.innerHTML = '<h2>' + g.name + '</h2>' +
      '<p class="note">อ่าน ' + g.path + '/config.json ไม่ได้ — ยังไม่ได้สร้างหรือยังไม่ได้ push</p>';
  });
}

fetch(base + 'galleries.json', { cache: 'no-store' })
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(data => {
    root.innerHTML = '';
    const list = data.galleries || [];
    if (!list.length) { root.innerHTML = '<p class="note">galleries.json ว่างอยู่</p>'; return; }
    // เรียงทีละอันเพื่อให้ลำดับบนหน้าคงที่
    return list.reduce((chain, g) => chain.then(() => renderGallery(g)), Promise.resolve());
  })
  .catch(() => {
    root.innerHTML = '<p class="note">อ่าน galleries.json ไม่ได้</p>';
  });
</script>
</body>
</html>
